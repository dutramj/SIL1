    control_heading: No # Flag to allow heading control
    tvc_factor: No # Flag for tvc computation
    use_ref_heading: No # Flag for using heading reference in roll control (bank to turn)
    wn_rc: 2.0 # Closed loop frequency
    zeta_rc: 0.7 # Damping factor    
  - phase_id: 3
    max_deflection: 20.0 # Maximum deflection for aerodynamic control surfaces, in deg
    max_rate: 60.0 # Maximum deflection rate for aerodynamic control surfaces, in deg/s
    control_surface_type: 0 # Configuration type: 0 - 4 CS in X; 1 - Elevons;
    control_roll: Yes # Flag to allow roll control
    control_rate: Yes # Flag to allow pitch / yaw rate control (damper)
    control_gamma: No # Flag to allow flight path angle control
    control_heading: No # Flag to allow heading control
    tvc_factor: No # Flag for tvc computation
    use_ref_heading: No # Flag for using heading reference in roll control (bank to turn)    
    wn_rc: 2.0 # Closed loop frequency
    zeta_rc: 0.7 # Damping factor  
  - phase_id: 4
    max_deflection: 20.0 # Maximum deflection for aerodynamic control surfaces, in deg
    max_rate: 60.0 # Maximum deflection rate for aerodynamic control surfaces, in deg/s
    control_surface_type: 1 # Configuration type: 0 - 4 CS in X; 1 - Elevons;
    control_roll: Yes # Flag to allow roll control
    control_rate: No # Flag to allow pitch / yaw rate control (damper)
