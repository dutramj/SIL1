rcs_parameters:
  - phase_id: 1 # Complete Vehicle
    rcs_long_arm: 6.0 # RCS longitudinal arm wrt to the datum, in m
    rcs_lat_arm: 1.0 # RCS lateral arm wrt to the datum, in m
    rcs_compute_initial_mass: No # If No, initial mass is considered as the one declared in this file, else, it's computed based on previous values.
    rcs_initial_mass: 100.0 # RCS Initial Mass, in kg
    rcs_Isp: 60.0 # RCS Specific Impulse, in s
    rcs_F_max: 100.0 # RCS thrusters maximum force for roll / pitch / yaw control, in N
    rcs_F_min: 0.0 # RCS thrusters minimum force for roll / pitch / yaw control, in N
    rcs_deadband: 0.5 # deadband for RCS control, in deg
    rcs_hysteresis: 0.1 # hysteresis for RCS control, in deg
    rcs_tau: 1.0 # RCS time constant, in s
    rcs_min_pulse: 0.03 # RCS minimum pulse duration, in s
    rcs_delay: 0.03 # delay for RCS control, in s
    rcs_min_alt: 50000.0 # Minimum altitude for considering RCS actuation
  - phase_id: 2 # Intermediate Stage with faring
    rcs_long_arm: 6.0 # RCS longitudinal arm wrt to the datum, in m
    rcs_lat_arm: 1.0 # RCS lateral arm wrt to the datum, in m
    rcs_compute_initial_mass: Yes # If No, initial mass is considered as the one declared in this file, else, it's computed based on previous values.
    rcs_initial_mass: 100.0 # RCS Initial Mass, in kg
    rcs_Isp: 60.0 # RCS Specific Impulse, in s
    rcs_F_max: 100.0 # RCS thrusters maximum force for roll / pitch / yaw control, in N
    rcs_F_min: 0.0 # RCS thrusters minimum force for roll / pitch / yaw control, in N
    rcs_deadband: 0.3 # deadband for RCS control, in deg
    rcs_hysteresis: 0.1 # hysteresis for RCS control, in deg
    rcs_tau: 1.0 # RCS time constant, in s
    rcs_min_pulse: 0.03 # RCS minimum pulse duration, in s
    rcs_delay: 0.03 # delay for RCS control, in s
    rcs_min_alt: 50000.0 # Minimum altitude for considering RCS actuation
  - phase_id: 3 # Intermediate stage without fairing
    rcs_long_arm: 5.0 # RCS longitudinal arm wrt to the datum, in m
    rcs_lat_arm: 1.0 # RCS lateral arm wrt to the datum, in m
    rcs_compute_initial_mass: Yes # If No, initial mass is considered as the one declared in this file, else, it's computed based on previous values.
    rcs_initial_mass: 100.0 # RCS Initial Mass, in kg
    rcs_Isp: 60.0 # RCS Specific Impulse, in s
    rcs_F_max: 100.0 # RCS thrusters maximum force for roll / pitch / yaw control, in N
    rcs_F_min: 0.0 # RCS thrusters minimum force for roll / pitch / yaw control, in N
    rcs_deadband: 0.3 # deadband for RCS control, in deg
    rcs_hysteresis: 0.1 # hysteresis for RCS control, in deg
    rcs_tau: 1.0 # RCS time constant, in s
    rcs_min_pulse: 0.03 # RCS minimum pulse duration, in s
    rcs_delay: 0.03 # delay for RCS control, in s
    rcs_min_alt: 50000.0 # Minimum altitude for considering RCS actuation
  - phase_id: 4 
    rcs_long_arm: 0.0 # RCS longitudinal arm wrt to the datum, in m
    rcs_lat_arm: 0.0 # RCS lateral arm wrt to the datum, in m
    rcs_compute_initial_mass: No # If No, initial mass is considered as the one declared in this file, else, it's computed based on previous values.
    rcs_initial_mass: 0.0 # RCS Initial Mass, in kg
    rcs_Isp: 0.0 # RCS Specific Impulse, in s
    rcs_F_max: 0.0 # RCS thrusters maximum force for roll / pitch / yaw control, in N
    rcs_F_min: 0.0 # RCS thrusters minimum force for roll / pitch / yaw control, in N
    rcs_deadband: 0.0 # deadband for RCS control, in deg
    rcs_hysteresis: 0.0 # hysteresis for RCS control, in deg
    rcs_tau: 0.0 # RCS time constant, in s
    rcs_min_pulse: 0.0 # RCS minimum pulse duration, in s
    rcs_delay: 0.0 # delay for RCS control, in s
    rcs_min_alt: 0.0 # Minimum altitude for considering RCS actuations
    
control_surfaces_set:
  actuator:
    natural_frequency: 100.0
    damping_ratio: 0.7
    nonlinearities:
      - type: velocity_limiter
        maximum_velocity: 1.0 # rad/s, aprox. ?? rpm, comes from actuator datasheet
      - type: velocity_dependent_acceleration_limiter # 
        velocity_lut: # rotation (rad/s)
        - 0.0
        - 4000.0
        acceleration_lut: # continuous_torque/inertia (rad/s² or Nm/Kg/m³)
        - 100.0
        - 0.0
    
tvc_parameters:

  - phase_id: 1 # Complete Vehicle
    type: tvc_simplified # must be: "tvc_simplified" or "tvc_detailed"
    max_tvc_deflect: 10.0 # Maximum TVC deflection, in deg
    max_tvc_rate: 100.0 # Maximum TVC deflection rate, in deg/s

    geometry: # position in relation to divergent pivot point
      structure_joint_x: 0.5 # rotational joint actuator-airframe, in meters
      initial_nozzle_joint_x: 0.2 # rotational joint divergent-actuator when delta=0, in meters
      initial_nozzle_joint_y: -0.2 # rotational joint divergent-actuator when delta=0, in meters
      initial_actuator_angle: 50.0 # angle between actuator and longitudinal axis when delta=0, in degrees

    belt:
      reduction_ratio: 2.0 # N:1 belt reduction between linear and angular actuators, adimensional
   
    angular_actuator:
      natural_frequency: 100.0 # dummy value, to be updated with identification essay
      damping_ratio: 0.7 # dummy value, to be updated with identification essay
      nonlinearities:
        - type: velocity_limiter
          maximum_velocity: 100.0 # rad/s, aprox. ? rpm, / 2.0 comes from linear actuator datasheet
        - type: velocity_dependent_acceleration_limiter
          velocity_lut: # rotation (rad/s)
          - 0.0
          - 4000.0
          acceleration_lut: # continuous_torque/inertia (rad/s² or Nm/Kg/m³)
          - 1000000.0
          - 0.0

    linear_actuator:
      natural_frequency: 100.0  # dummy value, to be updated with identification essay
      damping_ratio: 0.7 # dummy value, to be updated with identification essay
      lead: 0.01 # meters
      nonlinearities:
        - type: position_limiter
          maximum_position: 0.01 # meters (roughly ? degrees TVC deflexion according to TVC geometry)
        - type: acceleration_limiter
          maximum_acceleration: 10.0 # m/s²
          
  - phase_id: 2 # Second stage with fairing
    max_tvc_deflect: 0.0 # Maximum TVC deflection for TVC control module, in deg
    max_tvc_rate: 0.0 # Maximum TVC deflection rate, in deg/s
  - phase_id: 3 # Second stage without fairing
    max_tvc_deflect: 0.0 # Maximum TVC deflection for TVC control module, in deg
    max_tvc_rate: 0.0 # Maximum TVC deflection rate, in deg/s
  - phase_id: 4 
    max_tvc_deflect: 0.0 # Maximum TVC deflection for TVC control module, in deg
    max_tvc_rate: 0.0 # Maximum TVC deflection rate, in deg/s

aero_controls_parameters:
  - phase_id: 1
    max_deflection: 20.0 # Maximum deflection for aerodynamic control surfaces, in deg
    max_rate: 60.0 # Maximum deflection rate for aerodynamic control surfaces, in deg/s
    control_surface_type: 0  # Configuration type: 0 - 4 CS in X; 1 - Elevons;
    control_roll: Yes # Flag to allow roll control
    control_rate: No # Flag to allow pitch / yaw rate control (damper)
    control_gamma: No # Flag to allow flight path angle control
    control_heading: No # Flag to allow heading control
    tvc_factor: No # Flag for tvc computation
    use_ref_heading: No # Flag for using heading reference in roll control (bank to turn)
    wn_rc: 2.0 # Closed loop frequency
    zeta_rc: 0.7 # Damping factor
  - phase_id: 2
    max_deflection: 20.0 # Maximum deflection for aerodynamic control surfaces, in deg
    max_rate: 60.0 # Maximum deflection rate for aerodynamic control surfaces, in deg/s
    control_surface_type: 0 # Configuration type: 0 - 4 CS in X; 1 - Elevons;
    control_roll: Yes # Flag to allow roll control
