control_interlocks:
  - transition_time: 60.0 # Transition time from acceleration control to load alleviation, in s
    burnout_time: 70.0 #  Effective burn time, in s   
    action_time: 90.0 # Total burn time, in s
guidance_parameters:
  - max_turn_rate: 0.1 # Maximum allowed turn rate for guidance logic
