geometric_data:
  - phase_id: 1 # Complete Vehicle
    main_parameters:
      S_ref: 1.0 # Reference Area, in m²
      l_ref_1: 1.0 # Longitudinal reference length, in m
      l_ref_2: 1.0 # Lateral reference length, in m
      length: 10.0 # vehicle total length, in m
    other_parameters:
      x_top_of_engine: 7.0 # Distance beetween datum and top-of-engine, in m - Used for computing propellant CG wrt datum
      x_thrust: 12.0 # TVC actuation arm wrt to the datum, in m
      nozzle_exhaust_area: 0.5 # Nozzle Exhaust Area, in m²
  - phase_id: 2 # Intermediate stage with fairing
    main_parameters:
      S_ref: 1.0 # Reference Area, in m²
      l_ref_1: 1.0 # Longitudinal reference length, in m
      l_ref_2: 1.0 # Lateral reference length, in m
      length: 6.0 # vehicle total length, in m
    other_parameters:
      x_top_of_engine: 0.0 # Distance beetween datum and top-of-engine, in m - Used for computing propellant CG wrt datum
      x_thrust: 0.0 # TVC actuation arm wrt to the datum, in m
      nozzle_exhaust_area: 0.0 # Nozzle Exhaust Area, in m²       
  - phase_id: 3 # Intermediate stage with fairing
    main_parameters:
      S_ref: 1.0 # Reference Area, in m²
      l_ref_1: 5.0 # Longitudinal reference length, in m
      l_ref_2: 5.0 # Lateral reference length, in m
      length: 5.0 # vehicle total length, in m
    other_parameters:
      x_top_of_engine: 0.0 # Distance beetween datum and top-of-engine, in m - Used for computing propellant CG wrt datum
      x_thrust: 0.0 # TVC actuation arm wrt to the datum, in m
      nozzle_exhaust_area: 0.0 # Nozzle Exhaust Area, in m²       
  - phase_id: 4 
    main_parameters:
      S_ref: 0.5 # Reference Area, in m²
      l_ref_1: 3.0 # Longitudinal reference length, in m
      l_ref_2: 1.0 # Lateral reference length, in m
      length: 3.0 # vehicle total length, in m
    other_parameters:
      x_top_of_engine: 0.0 # Distance beetween datum and top-of-engine, in m - Used for computing propellant CG wrt datum
      x_thrust: 0.0 # TVC actuation arm wrt to the datum, in m
      nozzle_exhaust_area: 0.0 # Nozzle Exhaust Area, in m²
