simulator:

  sample_period: 0.05

  config_parameters: !yaml ./config_RATO.yaml

  atmosphere_model:
    type: lut # available options: lut, coesa1976
    interpolator: !csv ../datasets/alcantara_fusion.csv
    coesa_delta_temperature: 0.0  # [°C], temperature variation (COESA 1976 only)
  
  # TODO: each perturbation should be included in its respective module
  perturbations: !yaml ./perturbations.yaml

 # Wind Parameters
  wind:
  
    constant_wind: # Vento constante
      wind_speed: 0.0 # in m/s
      wind_direction: 0.0 # 0 deg: from North, 90 deg: from East, 180 deg: from South, 270 deg: from West
      wind_elevation: 0.0 # -90 deg: downwards, 0 deg: horizontal wind, 90 deg: upwards

