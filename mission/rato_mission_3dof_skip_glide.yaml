mission_plan:

  initial_state: !yaml ./initial_state.yaml

  flight_phases:

    # First stage - Open loop
    - end_condition:
        type: launch_tower
        value: 30.0
      dynamics:
        type: 3DOF_PointMass
      maneuver:
        type: straight
      actions:
        - target: simulator
          command: set_phase_id
          arguments:
            phase_id: 1

    # First stage - Pitch over
    - end_condition:
        type: duration
        value: 16.0
      maneuver:
        type: pitch_over
        alpha_max: 11.01405243
        tm: 2.5
        tp: 2.5

    # First stage - Gravity turn
    - end_condition:
        type: time
        value: 91.17
      maneuver:
        type: gravity_turn

    # Second stage - With fairing
    - end_condition:
        type: target_gamma
        target: 0.5
        direction: falling
      actions:
        - target: simulator
          command: set_phase_id
          arguments:
            phase_id: 2

    # Second stage - Without fairing
    - end_condition:
        type: target_gamma
        target: -0.5
        direction: falling
      actions:
        - target: simulator
          command: set_phase_id
          arguments:
            phase_id: 3

    # Gravity turn
    - end_condition:
        type: target_gamma
        target: -5.0
        direction: rising
      maneuver:
        type: pull_up
        alpha_max: 2.35315831
        tm: 2.5
        tp: 950.0
        t2: 1000.0
      actions:
        - target: simulator
          command: set_phase_id
          arguments:
            phase_id: 4

    # Phugoid
    - end_condition:
        type: duration
        value: 20.0
